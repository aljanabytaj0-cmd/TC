<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة التقديم - كلية تاليان للطب البشري</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f4f5f7; min-height: 100vh; }
  .navbar {
    background: #122A54; color: #fff; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .navbar a { color: #fff; font-size: 13px; text-decoration: none; }
  .navbar .brand { font-size: 15px; font-weight: 600; }
  .container { max-width: 560px; margin: 50px auto; padding: 0 20px; }
  .card { background: #fff; border-radius: 14px; padding: 32px 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); text-align: center; }
  .card h1 { font-size: 19px; color: #122A54; margin-bottom: 10px; }
  .card p { font-size: 13px; color: #6b7280; line-height: 1.9; margin-bottom: 8px; }
  .badge { display: inline-block; background: #fde8e8; color: #D8262E; font-size: 12px; padding: 4px 12px; border-radius: 20px; margin-top: 14px; }
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html">→ العودة للرئيسية</a>
  <div class="brand">كلية تاليان للطب البشري</div>
</div>

<div class="container">
  <div class="card">
    <h1>بوابة القبول والمفاضلة</h1>
    <p>نموذج التقديم الإلكتروني الكامل (رفع المستمسكات، الدفع، والمفاضلة التلقائية) قيد الإنشاء حالياً.</p>
    <p>للاستفسار عن القبول للفصل الحالي، يرجى التواصل معنا مباشرة عبر معلومات الاتصال بالصفحة الرئيسية.</p>
    <span class="badge">هذه الصفحة قيد التطوير</span>
  </div>
</div>

</body>
</html>

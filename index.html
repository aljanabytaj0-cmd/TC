<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلية تاليان للطب البشري - تسجيل الدخول</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #122A54;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  h1 { font-size: 18px; color: #122A54; text-align: center; margin-bottom: 4px; }
  p.sub { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; margin-top: 14px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 14px; direction: ltr; text-align: right;
  }
  input:focus { outline: 2px solid #122A54; border-color: transparent; }
  button {
    width: 100%; margin-top: 22px; padding: 11px; background: #D8262E;
    color: #fff; border: none; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #message { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  #message.error { color: #d8262e; }
  #message.success { color: #16a34a; }
</style>
</head>
<body>

<div class="card">
  <h1>كلية تاليان للطب البشري</h1>
  <p class="sub">تسجيل الدخول إلى النظام</p>

  <label for="email">البريد الإلكتروني</label>
  <input type="email" id="email" placeholder="you@example.com">

  <label for="password">كلمة المرور</label>
  <input type="password" id="password" placeholder="••••••••">

  <button id="loginBtn">تسجيل الدخول</button>
  <div id="message"></div>
</div>

<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // كل نوع حساب له صفحة مقصد مختلفة - نفس منطق "التوجيه التلقائي بعد الدخول"
  const REDIRECT_MAP = {
    STUDENT: "student.html",
    FACULTY: "faculty.html",
    STAFF: "staff.html",
    APPLICANT: "applicant.html",
  };

  const messageEl = document.getElementById("message");
  const loginBtn = document.getElementById("loginBtn");

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = type;
  }

  loginBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMessage("الرجاء إدخال البريد وكلمة المرور", "error");
      return;
    }

    loginBtn.disabled = true;
    showMessage("جاري التحقق...", "");

    try {
      await signInWithEmailAndPassword(auth, email, password);
      // onAuthStateChanged تحت رح تتكفل بالتوجيه
    } catch (err) {
      showMessage("بيانات الدخول غير صحيحة", "error");
      loginBtn.disabled = false;
    }
  });

  // لو المستخدم أصلاً مسجّل دخول (جلسة سابقة)، وجّهه فوراً بدون ما يشوف نموذج الدخول
  onAuthStateChanged(auth, async (user) => {
    if (!user) return;

    const userDocSnap = await getDoc(doc(db, "users", user.uid));
    if (!userDocSnap.exists()) {
      showMessage("لا يوجد ملف بيانات لهذا الحساب، راجع إدارة النظام", "error");
      loginBtn.disabled = false;
      return;
    }

    const data = userDocSnap.data();

    if (data.isSuperAdmin) {
      window.location.href = "dev.html";
      return;
    }

    const target = REDIRECT_MAP[data.userType];
    if (target) {
      window.location.href = target;
    } else {
      showMessage("نوع حساب غير معروف، راجع إدارة النظام", "error");
      loginBtn.disabled = false;
    }
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلية تاليان للطب البشري - تسجيل الدخول</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #122A54;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  h1 {
    font-size: 18px;
    color: #122A54;
    text-align: center;
    margin-bottom: 4px;
  }
  p.sub {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #374151;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    direction: ltr;
    text-align: right;
  }
  input:focus { outline: 2px solid #122A54; border-color: transparent; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 11px;
    background: #D8262E;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #message {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  #message.error { color: #d8262e; }
  #message.success { color: #16a34a; }
  #dashboard { display: none; text-align: center; }
  #dashboard h2 { color: #122A54; font-size: 17px; margin-bottom: 6px; }
  #dashboard p { color: #6b7280; font-size: 13px; margin-bottom: 4px; }
  #logoutBtn { background: #122A54; margin-top: 18px; }
</style>
</head>
<body>

<div class="card">

  <div id="loginBox">
    <h1>كلية تاليان للطب البشري</h1>
    <p class="sub">تسجيل الدخول إلى النظام</p>

    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="password">كلمة المرور</label>
    <input type="password" id="password" placeholder="••••••••">

    <button id="loginBtn">تسجيل الدخول</button>
    <div id="message"></div>
  </div>

  <div id="dashboard">
    <h2 id="welcomeName"></h2>
    <p id="welcomeType"></p>
    <p id="welcomeEmail"></p>
    <button id="logoutBtn">تسجيل الخروج</button>
  </div>

</div>

<!-- Firebase SDK عبر CDN مباشرة - بدون أي تثبيت أو npm -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // إعدادات مشروعك بالضبط كما ظهرت بلوحة Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCbAdssxVWFJp2KCy_ZJhrNlW_CB0fUVOA",
    authDomain: "talyan-fad6f.firebaseapp.com",
    projectId: "talyan-fad6f",
    storageBucket: "talyan-fad6f.firebasestorage.app",
    messagingSenderId: "1043413564562",
    appId: "1:1043413564562:web:db4fd444c0c2fe3654ba4b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginBox = document.getElementById("loginBox");
  const dashboard = document.getElementById("dashboard");
  const messageEl = document.getElementById("message");
  const loginBtn = document.getElementById("loginBtn");

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = type;
  }

  loginBtn.addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      showMessage("الرجاء إدخال البريد وكلمة المرور", "error");
      return;
    }

    loginBtn.disabled = true;
    showMessage("جاري التحقق...", "");

    try {
      await signInWithEmailAndPassword(auth, email, password);
      // onAuthStateChanged تحت رح تتكفل بعرض لوحة التحكم
    } catch (err) {
      showMessage("بيانات الدخول غير صحيحة", "error");
      loginBtn.disabled = false;
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    signOut(auth);
  });

  // يراقب حالة تسجيل الدخول تلقائياً، ويجلب بيانات المستخدم من Firestore
  onAuthStateChanged(auth, async (user) => {
    loginBtn.disabled = false;
    if (user) {
      const userDocRef = doc(db, "users", user.uid);
      const userDocSnap = await getDoc(userDocRef);

      if (!userDocSnap.exists()) {
        showMessage("تم الدخول لكن لا يوجد ملف بيانات لهذا الحساب بقاعدة البيانات", "error");
        return;
      }

      const data = userDocSnap.data();
      loginBox.style.display = "none";
      dashboard.style.display = "block";
      document.getElementById("welcomeName").textContent = "مرحباً " + (data.fullName || "");
      document.getElementById("welcomeType").textContent =
        "نوع الحساب: " + (data.isSuperAdmin ? "مطوّر (صلاحيات مطلقة)" : data.userType);
      document.getElementById("welcomeEmail").textContent = user.email;
    } else {
      loginBox.style.display = "block";
      dashboard.style.display = "none";
    }
  });
</script>

</body>
</html>

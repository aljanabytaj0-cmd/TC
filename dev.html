<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المطوّر - كلية تاليان</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f4f5f7; min-height: 100vh; }
  .topbar { background: #122A54; color: #fff; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .topbar h1 { font-size: 16px; font-weight: 600; }
  .topbar button { background: #D8262E; color: #fff; border: none; padding: 7px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .container { max-width: 700px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
  .card h2 { font-size: 15px; color: #122A54; margin-bottom: 4px; }
  .card p { font-size: 13px; color: #6b7280; margin-bottom: 14px; }
  .link-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 0.5px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; text-decoration: none; color: #122A54; font-size: 13px; font-weight: 600; }
  .link-row span.badge { font-size: 11px; font-weight: 400; color: #9ca3af; }
  #guard { text-align: center; padding: 80px 20px; color: #6b7280; }
</style>
</head>
<body>

<div id="guard">جاري التحقق من الصلاحيات...</div>

<div id="content" style="display:none;">
  <div class="topbar">
    <h1>لوحة المطوّر</h1>
    <button id="logoutBtn">تسجيل الخروج</button>
  </div>
  <div class="container">
    <div class="card">
      <h2 id="welcomeName"></h2>
      <p id="welcomeEmail"></p>
    </div>

    <div class="card">
      <h2>الإدارة</h2>
      <p>صلاحيات مطلقة على كل أجزاء النظام</p>
      <a class="link-row" href="admin-users.html">إدارة المستخدمين <span class="badge">إضافة وعرض</span></a>
    </div>

    <div class="card">
      <h2>معاينة البوابات</h2>
      <p>عرض كل بوابة كما يراها المستخدم العادي</p>
      <a class="link-row" href="student.html">بوابة الطالب <span class="badge">معاينة</span></a>
      <a class="link-row" href="faculty.html">بوابة التدريسي <span class="badge">معاينة</span></a>
      <a class="link-row" href="staff.html">النظام الإداري <span class="badge">معاينة</span></a>
      <a class="link-row" href="applicant.html">بوابة المتقدّم <span class="badge">معاينة</span></a>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const guardEl = document.getElementById("guard");
  const contentEl = document.getElementById("content");

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      guardEl.innerHTML = 'الرجاء تسجيل الدخول أولاً - <a href="index.html">اضغط هنا</a>';
      return;
    }
    const userDocSnap = await getDoc(doc(db, "users", user.uid));
    if (!userDocSnap.exists() || userDocSnap.data().isSuperAdmin !== true) {
      guardEl.innerHTML = 'لا تملك صلاحية الوصول لهذه الصفحة - <a href="index.html">العودة</a>';
      return;
    }
    const data = userDocSnap.data();
    guardEl.style.display = "none";
    contentEl.style.display = "block";
    document.getElementById("welcomeName").textContent = "مرحباً " + (data.fullName || "");
    document.getElementById("welcomeEmail").textContent = user.email;
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    signOut(auth).then(() => window.location.href = "index.html");
  });
</script>

</body>
</html>
